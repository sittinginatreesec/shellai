name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
            container: debian:bookworm
            deb_arch: amd64
            features: vulkan
            executable: shellai
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
            container: debian:bookworm
            deb_arch: arm64
            features: vulkan
            executable: shellai
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
            features: vulkan
            executable: shellai.exe
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64
            features: metal
            executable: shellai

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      # Vulkan's nested shader build exceeds MSVC path limits under the workspace.
      CARGO_TARGET_DIR: ${{ matrix.runner == 'windows-2025' && 'C:/t' || 'target' }}
    steps:
      - name: Bootstrap Debian build environment
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git sudo python3 cmake clang libclang-dev build-essential dpkg-dev zsh libvulkan-dev glslc spirv-headers mesa-vulkan-drivers
      - name: Configure MSVC for Ninja builds
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk ninja --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdk = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (!$sdk) { throw "Vulkan SDK installation not found" }
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Git Bash also supplies a GNU link.exe; Rust must use the MSVC linker.
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (!(Test-Path $linker)) { throw "MSVC linker not found: $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: actions/checkout@v4
      - name: Install current Vulkan headers against Debian 12 runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash packaging/vulkan-headers.sh "$GITHUB_WORKSPACE/target/vulkan-sdk"
          echo "VULKAN_SDK=$GITHUB_WORKSPACE/target/vulkan-sdk" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/target/vulkan-sdk" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check native toolchain architecture
        shell: bash
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}'
      - name: Build release binary
        shell: bash
        run: |
          if [[ -n '${{ matrix.features }}' ]]; then
            cargo build --locked --release --features '${{ matrix.features }}'
          else
            cargo build --locked --release
          fi
      - name: Run tests on native runner
        shell: bash
        run: cargo test --locked --features '${{ matrix.features }}'
      - name: Exercise native CLI and IPC without model downloads
        if: runner.os == 'Linux'
        run: python3 tests/cli_smoke.py '${{ env.CARGO_TARGET_DIR }}/release/${{ matrix.executable }}'
      - name: Enumerate compute backends without model weights
        shell: bash
        run: '${{ env.CARGO_TARGET_DIR }}/release/${{ matrix.executable }} devices'
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp '${{ env.CARGO_TARGET_DIR }}/release/${{ matrix.executable }}' dist/
          cp shellai.plugin.zsh README.md LICENSE dist/
          tar -czf 'shellai-${{ matrix.artifact }}.tar.gz' -C dist .
      - name: Build Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          bash packaging/deb.sh "${{ env.CARGO_TARGET_DIR }}/release/shellai" "$version" "${{ matrix.deb_arch }}"
          sudo apt-get install -y ./dist/*.deb
          zsh -ic '(( $+functions[shellai-hotkey] ))'
          sudo apt-get remove -y shellai
          if grep -qF '# shellai package' /etc/zsh/zshrc; then
            echo 'Package removal left the ZSH loader installed' >&2
            exit 1
          fi
          sudo apt-get purge -y shellai
      - uses: actions/upload-artifact@v4
        with:
          name: shellai-${{ matrix.artifact }}
          path: |
            shellai-${{ matrix.artifact }}.tar.gz
            dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          find release-assets -type f \( -name '*.tar.gz' -o -name '*.deb' \) -exec cp {} . \;
          sha256sum ./*.tar.gz ./*.deb > SHA256SUMS
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              if (( attempt == 5 )); then return 1; fi
              echo "GitHub request failed; retrying (attempt $attempt/5)" >&2
              sleep "$((attempt * 5))"
            done
          }
          if ! retry gh release view "$TAG"; then
            retry gh release create "$TAG" --verify-tag --generate-notes
          fi
          # Upload sequentially so a transient failure retries only one asset.
          # Publish checksums last, after all referenced assets have uploaded.
          for asset in ./*.tar.gz ./*.deb SHA256SUMS; do
            retry gh release upload "$TAG" "$asset" --clobber
          done
